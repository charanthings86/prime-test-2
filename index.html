  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Primee Ways | Digital Marketing Agency for Healthcare &amp; Real Estate</title>
    <meta name="title" content="Primee Ways | Digital Marketing Agency for Healthcare &amp; Real Estate" />
    <meta name="description" content="Primee Ways (primeeways.in) is a premier digital marketing agency accelerating Healthcare practices and Real Estate developers with high-intent patient acquisition, property buyer funnels, SEO, paid media, and bespoke web solutions." />
    <meta name="keywords" content="digital marketing agency, healthcare marketing, real estate marketing, clinic SEO, property lead generation, medical marketing, primee ways, primeeways.in" />
    <meta name="author" content="Charan - Primee Ways" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://primeeways.in" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://primeeways.in/" />
    <meta property="og:title" content="Primee Ways | Digital Marketing Agency for Healthcare &amp; Real Estate" />
    <meta property="og:description" content="Dedicated growth agency scaling Healthcare and Real Estate brands through hyper-targeted paid ads, search dominance, conversion web engineering, and brand authority." />
    <meta property="og:site_name" content="Primee Ways" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@primee_ways" />
    <meta name="twitter:creator" content="@primee_ways" />
    <meta name="twitter:title" content="Primee Ways | Digital Marketing Agency for Healthcare &amp; Real Estate" />
    <meta name="twitter:description" content="Dedicated growth agency scaling Healthcare and Real Estate brands through hyper-targeted paid ads, search dominance, conversion web engineering, and brand authority." />

    <!-- Theme Color and Color Scheme -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0A0C10" />

    <!-- Google Fonts: Space Grotesk, Syne, Cormorant Garamond, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Inline script to set initial dark theme and prevent FOUC -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('primeeways_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#F9F7F4');
          } else {
            // Default dark mode
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0A0C10');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-light-bg text-light-text dark:bg-dark-bg dark:text-dark-text font-sans antialiased selection:bg-silver-500/20 selection:text-silver-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
